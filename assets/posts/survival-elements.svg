<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title description">
<title id="title">四项生存要素的作用与联系</title>
<desc id="description">人身权利置于上方，表达主体资格与制度保障。金钱资产、生理维持和心理功能分列左右及下方。金钱资产通过缓解经济压力、提供选择空间支持心理功能。生理维持包括氧气、营养与水分，以及适宜的温度与压力条件。虚线表示行动及反馈路径。</desc>
<defs>
  <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#3575a6" stroke-width="1.5"/></marker>
  <marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#b97a20" stroke-width="1.5"/></marker>
  <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#258171" stroke-width="1.5"/></marker>
  <marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7761ad" stroke-width="1.5"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;text-anchor:middle;fill:#304452}
    .label{font-size:17px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
    .heading{font-size:27px;font-weight:700}
    .detail{font-size:18px}
    .small{font-size:15px;fill:#647681}
    .edge{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
    .feedback{stroke-dasharray:7 7}
  </style>
</defs>
<rect width="1200" height="920" fill="#fff"/>
<text x="600" y="36" font-size="21" font-weight="600">四项生存要素的作用与联系</text>

<!-- Institutional guarantees: three concrete paths, not an umbrella property-rights claim. -->
<g class="edge" stroke="#3575a6" marker-end="url(#blue)">
  <path d="M440 225C420 275 340 295 300 355"/>
  <path d="M760 225C780 275 860 295 900 355"/>
  <path d="M900 150H1140Q1160 150 1160 170V715Q1160 735 1140 735H900"/>
</g>
<text x="326" y="285" class="label" style="fill:#3575a6">保障经济活动中的自由</text>
<text x="884" y="285" class="label" style="fill:#3575a6">保护生命与身体安全</text>
<text x="1100" y="237" class="label" style="fill:#3575a6">自主选择</text>
<text x="1100" y="262" class="label" style="fill:#3575a6">表达自由</text>

<!-- Material provision and action / feedback paths. -->
<path class="edge" d="M480 395H720" stroke="#b97a20" marker-end="url(#gold)"/>
<text x="600" y="379" class="label" style="fill:#986311">营养、水分与防护物资</text>
<path class="edge feedback" d="M720 477C670 550 530 550 480 477" stroke="#258171" marker-end="url(#green)"/>
<text x="600" y="558" class="label" style="fill:#258171">经劳动参与获得收入</text>
<path class="edge" d="M872 495C860 562 792 610 737 665" stroke="#258171" marker-end="url(#green)"/>
<text x="820" y="588" class="label" style="fill:#258171">支持认知与情绪活动</text>
<path class="edge feedback" d="M850 665C1035 652 1095 578 1045 495" stroke="#7761ad" marker-end="url(#purple)"/>
<text x="1035" y="591" class="label" style="fill:#7761ad">摄食与自我照料</text>
<path class="edge feedback" d="M390 665C278 623 226 564 230 495" stroke="#7761ad" marker-end="url(#purple)"/>
<text x="278" y="581" class="label" style="fill:#7761ad">求职、劳动与经济决策</text>
<path class="edge" d="M400 495C410 555 480 610 525 665" stroke="#b97a20" marker-end="url(#gold)"/>
<text x="510" y="590" class="label" style="fill:#986311">缓解经济压力</text>
<text x="510" y="615" class="label" style="fill:#986311">提供选择空间</text>
<path class="edge feedback" d="M300 735H70Q40 735 40 705V230Q40 200 70 200H300" stroke="#3575a6" marker-end="url(#blue)"/>
<text x="134" y="240" class="label" style="fill:#3575a6">表达诉求</text>
<text x="134" y="265" class="label" style="fill:#3575a6">寻求救济</text>
<text x="134" y="294" class="small">参与权利的实现</text>

<!-- Four elements. -->
<g>
  <rect x="300" y="70" width="600" height="155" rx="18" fill="#eef5fd" stroke="#82add0" stroke-width="1.5"/>
  <text x="600" y="111" class="heading" style="fill:#19558a">人身权利</text>
  <text x="600" y="155" class="detail">生命、自由、安全与自主选择</text>
  <text x="600" y="195" class="small">主体资格、制度保障与保护救济</text>

  <rect x="120" y="355" width="360" height="140" rx="18" fill="#fff8eb" stroke="#d8b46f" stroke-width="1.5"/>
  <text x="300" y="397" class="heading" style="fill:#925d13">金钱资产</text>
  <text x="300" y="434" class="detail">收入、储蓄与可供使用的资产</text>
  <text x="300" y="480" class="small">支持生活资源的获得与配置</text>

  <rect x="720" y="355" width="360" height="140" rx="18" fill="#eef8f4" stroke="#8cbead" stroke-width="1.5"/>
  <text x="900" y="397" class="heading" style="fill:#146f59">生理维持</text>
  <text x="900" y="434" class="detail">氧气、营养与水分</text>
  <text x="900" y="457" class="detail">适宜的温度与压力条件</text>
  <text x="900" y="480" class="small">维持身体运行与活动</text>

  <rect x="300" y="665" width="600" height="145" rx="18" fill="#f4f1fc" stroke="#b6a6d9" stroke-width="1.5"/>
  <text x="600" y="708" class="heading" style="fill:#665196">心理功能</text>
  <text x="600" y="747" class="detail">认知、情绪感受与自我调节</text>
  <text x="600" y="780" class="small">形成生活意愿，支持判断与行动</text>
</g>

<path d="M180 854H228" stroke="#536873" stroke-width="2.3"/>
<text x="375" y="860" class="small">实线：制度保障与直接支持</text>
<path d="M675 854H723" stroke="#536873" stroke-width="2.3" stroke-dasharray="7 7"/>
<text x="869" y="860" class="small">虚线：行动路径与反馈</text>
<text x="600" y="895" class="small">制度保障支持个人行动，权利主张参与保障的实现</text>
</svg>
